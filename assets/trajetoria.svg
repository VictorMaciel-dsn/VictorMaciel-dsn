="tag"><rect x="99.0" y="342" width="68.0" height="19" rx="9.5"/><text x="133.0" y="355" text-anchor="middle">JavaScript</text></g><g class="tag"><rect x="172.0" y="342" width="68.0" height="19" rx="9.5"/><text x="206.0" y="355" text-anchor="middle">TypeScript</text></g><g class="tag"><rect x="245.0" y="342" width="38.0" height="19" rx="9.5"/><text x="264.0" y="355" text-anchor="middle">Sass</text></g><g class="tag"><rect x="288.0" y="342" width="63.0" height="19" rx="9.5"/><text x="319.5" y="355" text-anchor="middle">Bootstrap</text></g></g><g class="cartao dir" style="animation-delay:0.79s"><rect x="474.0" y="308" width="372" height="160" rx="16" fill="#0c1426" stroke="#f9fafb24"/><text class="periodo" x="491.0" y="337">MAI — JUL 2021</text><text class="cargo" x="491.0" y="358">Técnico de Infraestrutura Cloud</text><text class="empresa" x="491.0" y="376">Alterdata Software</text><text class="texto" x="491.0" y="396">Manutenção de servidores em nuvem, implantação de clientes</text><text class="texto" x="491.0" y="412">e otimização do banco de dados.</text><g class="tag"><rect x="491.0" y="432" width="33.0" height="19" rx="9.5"/><text x="507.5" y="445" text-anchor="middle">AWS</text></g><g class="tag"><rect x="529.0" y="432" width="53.0" height="19" rx="9.5"/><text x="555.5" y="445" text-anchor="middle">Nutanix</text></g><g class="tag"><rect x="587.0" y="432" width="48.0" height="19" rx="9.5"/><text x="611.0" y="445" text-anchor="middle">VMware</text></g></g><g class="cartao esq" style="animation-delay:0.97s"><rect x="34.0" y="400" width="372" height="160" rx="16" fill="#0c1426" stroke="#f9fafb24"/><text class="periodo" x="51.0" y="429">JUL 2020 — JUN 2022</text><text class="cargo" x="51.0" y="450">Técnico de Help Desk</text><text class="empresa" x="51.0" y="468">Alterdata Software</text><text class="texto" x="51.0" y="488">Suporte ao cliente, resolução de problemas e manutenção de</text><text class="texto" x="51.0" y="504">sistemas e banco de dados.</text><g class=