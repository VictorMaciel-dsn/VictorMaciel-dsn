<svg xmlns="http://www.w3.org/2000/svg" width="880" height="588" viewBox="0 0 880 588" role="img" aria-label="Trajetória profissional de Victor Maciel">
<title>Trajetória — Victor Maciel</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.periodo{font-size:10px;font-weight:700;letter-spacing:.12em;fill:#60a5fa}
.agora{font-size:9px;font-weight:800;letter-spacing:.12em;fill:#34d399}
.cargo{font-size:15px;font-weight:700;fill:#f9fafb}
.empresa{font-size:12px;font-weight:600;fill:#b4bdcb}
.texto{font-size:11.5px;fill:#98a3b4}
.ano{font-size:11px;font-weight:800;fill:#f9fafb}
.tag rect{fill:#2563eb1f;stroke:#2563eb66}
.tag text{font-size:10px;font-weight:600;fill:#60a5fa}
.tag.ia rect{fill:#34d3991a;stroke:#34d39980}
.tag.ia text{fill:#34d399}
.eixo{stroke-dasharray:574;animation:desenha 1.8s ease-out both}
.cartao{animation:entra .8s cubic-bezier(.2,.7,.2,1) both}
.cartao.esq{--de:-28px}.cartao.dir{--de:28px}
.no{animation:surge .5s ease-out both;transform-box:fill-box;transform-origin:center}
.pulso{animation:pulso 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.pisca{animation:pisca 1.4s ease-in-out infinite}
.viajante{animation:viaja 5s ease-in-out infinite}
@keyframes desenha{from{stroke-dashoffset:574}to{stroke-dashoffset:0}}
@keyframes entra{from{opacity:0;transform:translateX(var(--de))}to{opacity:1;transform:none}}
@keyframes surge{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes pulso{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.7)}}
@keyframes pisca{50%{opacity:.25}}
@keyframes viaja{from{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}to{transform:translateY(544px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="gEixo" gradientUnits="userSpaceOnUse" x1="440.0" y1="14" x2="440.0" y2="574"><stop offset="0" stop-color="#34d399"/><stop offset=".35" stop-color="#2563eb"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient>
<radialGradient id="brilho" cx=".5" cy="0" r=".8"><stop offset="0" stop-color="#2563eb" stop-opacity=".2"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
<radialGradient id="gViajante"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
<filter id="halo" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
<clipPath id="card"><rect width="880" height="588" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="880" height="588" fill="#070b16"/>
<rect width="880" height="588" fill="url(#brilho)"/>
